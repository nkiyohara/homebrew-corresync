name: Test Formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Audit, install, and test
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage Formula in the tap
        run: |
          brew tap nkiyohara/corresync
          cp Formula/corresync.rb "$(brew --repository nkiyohara/corresync)/Formula/corresync.rb"

      - name: Audit Formula
        run: brew audit --formula nkiyohara/corresync/corresync

      - name: Build from source and test
        run: |
          brew install --build-from-source nkiyohara/corresync/corresync
          brew test nkiyohara/corresync/corresync
          corresync version --json
